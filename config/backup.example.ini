# Copy outside the repository; paths use the collector's environment expansion.
[backup]
collector_config = %LOCALAPPDATA%\CodexMobileDashboard\config\collector.ini
output_dir = %LOCALAPPDATA%\CodexMobileDashboard\backups
mutex_wait_seconds = 300
minimum_free_bytes = 1073741824
include_logs = false
# Explicit issuance assets. List files/directories on separate indented lines.
# Empty means issuance materials are not stored on this PC; record this decision.
tls_sources =
    %LOCALAPPDATA%\CodexMobileDashboard\certificates
task_names =
    CodexMobileDashboard-Collector
    CodexMobileDashboard-PendingQueueRetry

# Phase D: SSH config alias with key authentication and verified known_hosts.
[android]
ssh_host = dashboard-android
repository = /data/data/com.termux/files/home/CodexMobileDashboard/app
config = /data/data/com.termux/files/home/.config/codex-mobile-dashboard/server.ini
output = /data/data/com.termux/files/home/CodexMobileDashboard/backups
ca = /data/data/com.termux/files/home/.config/codex-mobile-dashboard/tls/ca.crt
health_url = https://192.0.2.10:8765/health
minimum_free_bytes = 1073741824
wait_seconds = 1800
