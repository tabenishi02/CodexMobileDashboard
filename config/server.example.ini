; 実ファイルはリポジトリ外へ置く。Tokenの値はこのINIへ書かない。
[server]
host = 0.0.0.0
port = 8765
certificate_file = ~/.config/codex-mobile-dashboard/tls/server.crt
private_key_file = ~/.config/codex-mobile-dashboard/tls/server.key
static_directory = ~/CodexMobileDashboard/client
public_directory = ~/CodexMobileDashboard/data/public

[auth]
token_file = ~/.config/codex-mobile-dashboard/server.token