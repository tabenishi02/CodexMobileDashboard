# Codex Mobile Dashboard collector configuration example.
# Copy this file to:
# %LOCALAPPDATA%\CodexMobileDashboard\config\collector.ini
# Do not put tokens or private keys in this file.

[discovery]
allowed_roots =
    C:\codex
sessions_dir = %USERPROFILE%\.codex\sessions
archived_sessions_dir = %USERPROFILE%\.codex\archived_sessions
scan_archived_sessions = true
require_git = true
require_initial_commit = true
auto_register = true

[collector]
working_poll_seconds = 30
idle_poll_seconds = 60
heartbeat_seconds = 300

[sender]
# 192.0.2.0/24 is reserved for documentation. Replace it with the fixed
# address or hostname present in the Android server certificate SAN.
base_url = https://192.0.2.10:8765
timeout_seconds = 10
max_attempts = 5
backoff_initial_seconds = 1
backoff_max_seconds = 16
request_target_bytes = 819200
request_max_bytes = 1048576
token_file = %LOCALAPPDATA%\CodexMobileDashboard\secrets\sender.token
ca_file = %LOCALAPPDATA%\CodexMobileDashboard\certificates\ca.crt

[storage]
output_dir = %LOCALAPPDATA%\CodexMobileDashboard\data
state_file = %LOCALAPPDATA%\CodexMobileDashboard\state\collector-state.json
workspace_registry = %LOCALAPPDATA%\CodexMobileDashboard\state\workspaces.json
queue_dir = %LOCALAPPDATA%\CodexMobileDashboard\queue
message_chunk_bytes = 262144
page_max_items = 100
page_max_bytes = 524288

[logging]
directory = %LOCALAPPDATA%\CodexMobileDashboard\logs
level = INFO
retention_days = 7
